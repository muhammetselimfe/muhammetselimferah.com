    <div class="noscript">
      <p>Selim Ferah is a developer advocate and full-stack engineer in the Avalanche ecosystem, based in Malta.</p>
      <p>He founded <a href="https://l1beat.io">L1Beat</a>, an analytics platform and public data API for Avalanche L1s, which received the largest Avalanche Retro9000 grant. He has been an Avalanche Ambassador since 2020, writing guides on <a href="https://medium.com/@avax">Medium</a>, running university workshops in Malta and Turkey, and mentoring builders.</p>
      <p>Projects: L1Beat, L1Beat Frontend, L1Beat Backend, Icicle Indexer and Icicle Markets. Works with Solidity, TypeScript, Go, React and Node.js.</p>
      <p>Contact: <a href="mailto:selim@l1beat.io">selim@l1beat.io</a>, <a href="https://www.linkedin.com/in/muhammetselimfe/">LinkedIn</a>, <a href="https://x.com/muhammetselimfe">X</a>, <a href="https://github.com/muhammetselimfe">GitHub</a>.</p>
